[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-control-centre"
version = "1.0.7"
description = "Task-oriented Linux control panel for user-configured local AI services"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
keywords = ["local-ai", "llama-cpp", "comfyui", "linux", "llm"]

[project.urls]
Homepage = "https://github.com/gbhobbytech/AI-Control-Centre"
Repository = "https://github.com/gbhobbytech/AI-Control-Centre"
Issues = "https://github.com/gbhobbytech/AI-Control-Centre/issues"

[project.scripts]
ai-control-centre = "ai_control_centre.cli:main"
ai-control-centre-gui = "ai_control_centre.gui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
