[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-control-centre"
version = "1.0.2"
description = "Lightweight Linux control panel backend for user-configured local AI services"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ai-control-centre = "ai_control_centre.cli:main"
ai-control-centre-gui = "ai_control_centre.gui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
