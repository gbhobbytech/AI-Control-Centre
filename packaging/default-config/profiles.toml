# Starter task profiles.
# Coding and Chat receive their real default models during the Setup Wizard.
# Agent remains unavailable until both a model and harness are configured.

[profiles.coding]
display_name = "Coding"
services = ["llama"]
open_service = "llama"

[profiles.chat]
display_name = "Chat"
services = ["llama"]
open_service = "llama"

[profiles.agent]
display_name = "Agent"
services = ["llama"]
