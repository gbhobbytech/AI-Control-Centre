[services.llama]
display_name = "llama.cpp"
type = "process"
executable = "~/ai/apps/llama.cpp/build/bin/llama-server"
cwd = "~/ai/apps/llama.cpp"
default_model = "qwen3_coder_30b_heretic"
args = [
  "-m", "{model.path}",
  "-ngl", "{model.recommended_gpu_layers}",
  "--ctx-size", "{model.recommended_context_length}",
  "--n-predict", "{model.max_output_tokens}",
  "--cache-type-k", "{model.cache_type_k}",
  "--cache-type-v", "{model.cache_type_v}",
  "--flash-attn", "{model.flash_attention}",
  "--temp", "0.2",
  "--host", "127.0.0.1",
  "--port", "8080",
]
open_url = "http://127.0.0.1:8080"
stop_timeout = 10
log_max_bytes = 2000000
gpu = true
conflict_groups = ["large-gpu-workload"]

[services.llama.model_defaults]
# Compatibility fallbacks; main llama launches require reviewed per-model settings.
max_output_tokens = 2048
flash_attention = "auto"
recommended_gpu_layers = 0
recommended_context_length = 4096
cache_type_k = "f16"
cache_type_v = "f16"

[services.llama.health]
url = "http://127.0.0.1:8080/health"
expected_status = 200
retry_interval = 1.0
startup_timeout = 120.0
request_timeout = 2.0


[services.prompt_helper]
display_name = "Prompt Helper"
type = "process"
executable = "~/ai/apps/llama.cpp/build/bin/llama-server"
cwd = "~/ai/apps/llama.cpp"
args = [
  "-m", "{model.path}",
  "-ngl", "0",
  "--ctx-size", "4096",
  "--n-predict", "2048",
  "--cache-type-k", "q8_0",
  "--cache-type-v", "q8_0",
  "--temp", "0.2",
  "--host", "127.0.0.1",
  "--port", "8081",
]
stop_timeout = 10
log_max_bytes = 1000000
gpu = false

[services.prompt_helper.health]
url = "http://127.0.0.1:8081/health"
expected_status = 200
retry_interval = 1.0
startup_timeout = 120.0
request_timeout = 2.0

[services.computer_dmz]
display_name = "Computer DMZ"
type = "docker"
container_name = "cptr-dmz"
open_url = "http://127.0.0.1:8001"
stop_timeout = 10
dependencies = ["llama"]

[services.computer_dmz.health]
url = "http://127.0.0.1:8001/openapi.json"
expected_status = 200
body_contains = "\"openapi\""
retry_interval = 1.0
startup_timeout = 60.0
request_timeout = 2.0

[services.comfyui]
display_name = "ComfyUI"
type = "process"
executable = "~/ai/ComfyUI/venv/bin/python"
cwd = "~/ai/ComfyUI"
args = ["main.py"]
open_url = "http://127.0.0.1:8188"
stop_timeout = 10
log_max_bytes = 2000000
gpu = true
conflict_groups = ["large-gpu-workload"]

[services.comfyui.health]
url = "http://127.0.0.1:8188/system_stats"
expected_status = 200
body_contains = "comfyui_version"
retry_interval = 1.0
startup_timeout = 120.0
request_timeout = 2.0
